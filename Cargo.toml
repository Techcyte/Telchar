[workspace]
members = ["crates/nix-worker-protocol", "crates/telchar"]
resolver = "2"

[workspace.dependencies]
tracing = "0.1.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "env-filter",
  "fmt",
  "registry",
] }
tracing-opentelemetry = { version = "0.33.0", default-features = false, features = [
  "metrics",
] }
opentelemetry = { version = "0.32.0", default-features = false, features = [
  "logs",
  "metrics",
  "trace",
] }
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = [
  "logs",
  "metrics",
  "rt-tokio",
  "trace",
] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
  "grpc-tonic",
  "logs",
  "metrics",
  "trace",
] }
opentelemetry-appender-tracing = "0.32.0"
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["transport"] }
opentelemetry-proto = { version = "0.32.0", default-features = false, features = [
  "gen-tonic",
  "logs",
  "metrics",
  "trace",
] }
