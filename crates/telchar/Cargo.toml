[package]
name = "telchar"
version = "2026.11.8"
edition = "2024"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
nix-worker-protocol = { path = "../nix-worker-protocol" }
telchar-telemetry = { path = "../telchar-telemetry" }
serde.workspace = true
serde_json.workspace = true
opentelemetry.workspace = true
tokio.workspace = true
rustix = { version = "1.1.6", features = [
  "event",
  "fs",
  "net",
  "process",
  "time",
] }
tracing.workspace = true
sha2 = "0.11"
dtoa = "1.0"
zstd = "0.14"
hmac = "0.13"
base64 = "0.23"
postgres = "0.19"
r2d2 = "0.8"
tokio-postgres = "0.7"
scheduled-thread-pool = "0.2.8"
tokio-postgres-rustls = "0.14"
rustls-native-certs = "0.8"
url = "2"
toml = "1.2"
reqwest.workspace = true
rustls.workspace = true
tungstenite.workspace = true
jsonwebtoken = { version = "12.0.0", features = ["aws_lc_rs"] }
tempfile = "3.27.0"
signal-hook = "0.4"
libc = "0.2"
aws-config = { version = "1.13.3", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-ec2 = { version = "1.283.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-credential-types = "1.3.1"
aws-sigv4 = "1.6.6"

[dev-dependencies]
telchar-test-support = { path = "../telchar-test-support" }
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-proto.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
