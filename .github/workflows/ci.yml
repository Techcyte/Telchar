name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks and tests
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Allow test namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check canonical-store prerequisites
        run: |
          started=$(date --iso-8601=seconds)
          if nix develop -c bash tests/canonical-store.sh true; then
            exit 0
          else
            fixture_exit=$?
          fi
          for setting in kernel.apparmor_restrict_unprivileged_userns \
                         kernel.unprivileged_userns_clone \
                         user.max_user_namespaces; do
            sysctl "$setting" || true
          done
          sudo -n journalctl --kernel --since "$started" --no-pager \
            --grep='apparmor=.*(userns_create|capable)' || true
          exit "$fixture_exit"

      - name: Check execution-store prerequisites
        run: >-
          nix develop -c bash scripts/test-execution-store.sh /bin/sh -c true

      - name: Check formatting
        run: nix develop -c cargo fmt --all -- --check

      - name: Check workspace
        run: nix develop -c cargo check --locked --workspace

      - name: Lint workspace
        run: >-
          nix develop -c cargo clippy --locked --workspace
          --all-targets -- -D warnings

      - name: Run workspace tests
        run: |
          nix develop -c cargo build --locked -p telchar --bin telchar
          export TELCHAR_TEST_DAEMON_BIN="$PWD/target/debug/telchar"
          nix develop -c bash tests/workspace.sh --locked

      - name: Run release tooling tests
        run: |
          nix develop -c scripts/test-prepare-release.py
          nix develop -c scripts/test-release-notes.py

      - name: Check Rust dependencies and licenses
        run: |
          nix develop -c scripts/check-advisory-exceptions.py
          nix develop -c cargo deny check advisories licenses sources

  nix:
    name: Nix build and evaluation
    needs: rust
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    env:
      NIXPKGS_ALLOW_UNFREE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        # v31.11.1
        uses: >-
          cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            keep-derivations = true
            keep-outputs = true

      - name: Allow test namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Restore and save Nix store
        # v7
        uses: >-
          nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: >-
            nix-build-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('flake.lock', 'Cargo.lock', '**/*.nix', '**/Cargo.toml')
            }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-prefixes-first-match: |
            nix-build-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 5G

      - name: Evaluate flake checks
        run: nix flake check --impure --no-build

      - name: Build Telchar
        run: nix build --impure --out-link "$RUNNER_TEMP/telchar" .#telchar

      - name: Build Nomad worker
        run: |
          log="$RUNNER_TEMP/telchar-nomad-worker.log"
          set +e
          nix build --impure -L --log-lines 120 \
            --out-link "$RUNNER_TEMP/telchar-nomad-worker" \
            .#telchar-nomad-worker 2>&1 | tee "$log"
          build_status=("${PIPESTATUS[@]}")
          set -e
          if ((build_status[0] != 0)); then
            tail -n 120 "$log" | tail -c 24000 | \
              split -b 3000 - "$RUNNER_TEMP/worker-failure-"
            for chunk in "$RUNNER_TEMP"/worker-failure-*; do
              diagnostics=$(< "$chunk")
              diagnostics=${diagnostics//'%'/'%25'}
              diagnostics=${diagnostics//$'\r'/'%0D'}
              diagnostics=${diagnostics//$'\n'/'%0A'}
              printf '::error title=Worker package failure %s::%s\n' \
                "${chunk##*-}" "$diagnostics"
            done
            exit "${build_status[0]}"
          fi
          exit "${build_status[1]}"

      - name: Test OCI publication contracts
        run: nix develop -c python scripts/test-publish-oci-images.py

      - name: Build OCI image contracts
        run: nix build --impure --no-link .#checks.x86_64-linux.oci-images

      - name: Scan OCI images
        run: scripts/check-oci-images.sh

      - name: Check VM acceleration
        run: test -r /dev/kvm && test -w /dev/kvm

      - name: Build configured MicroVM service contract
        run: nix build --no-link .#checks.x86_64-linux.nixos-microvm-service

      - name: Publish main images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: main
        run: scripts/publish-oci-images.sh
