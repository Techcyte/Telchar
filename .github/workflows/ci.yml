name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks and tests
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: nix develop -c cargo fmt --all -- --check

      - name: Check workspace
        run: nix develop -c cargo check --locked --workspace

      - name: Lint workspace
        run: nix develop -c cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: nix develop -c cargo test --locked --workspace -- --test-threads=1

      - name: Run release tooling tests
        run: |
          nix develop -c scripts/test-prepare-release.py
          nix develop -c scripts/test-release-notes.py

      - name: Check Rust dependencies and licenses
        run: |
          nix develop -c scripts/check-advisory-exceptions.py
          nix develop -c cargo deny check advisories licenses sources

  nix:
    name: Nix build and evaluation
    needs: rust
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    env:
      NIXPKGS_ALLOW_UNFREE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate flake checks
        run: nix flake check --impure --no-build

      - name: Build Telchar
        run: nix build --impure --no-link .#telchar

      - name: Build Nomad worker
        run: nix build --impure --no-link .#telchar-nomad-worker

      - name: Test OCI publication contracts
        run: nix develop -c python scripts/test-publish-oci-images.py

      - name: Build OCI image contracts
        run: nix build --impure --no-link .#checks.x86_64-linux.oci-images

      - name: Scan OCI images
        run: scripts/check-oci-images.sh

      - name: Publish main images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: main
        run: scripts/publish-oci-images.sh
