name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: CalVer release version (YYYY.M.PATCH); defaults to the current month with patch 0
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Open release pull request
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            keep-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        # v7
        uses: >-
          nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: >-
            nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{
            hashFiles('flake.lock') }}-${{ github.run_id }}-${{
            github.run_attempt }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          gc-max-store-size: 5G

      - name: Prepare version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$REQUESTED_VERSION" ]]; then
            version=$(nix develop -c scripts/prepare-release.py --version "$REQUESTED_VERSION")
          else
            version=$(nix develop -c scripts/prepare-release.py)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Open release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          branch="release/v$VERSION"
          title="release: prepare v$VERSION"
          body="Prepares Telchar v$VERSION. Merge after review, "
          body+="then run the Publish release workflow for this version."
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          git switch -C "$branch"
          git add Cargo.lock crates/*/Cargo.toml crates/nix-worker-protocol/fuzz/Cargo.lock nix/packages.nix
          if git diff --cached --quiet; then
            echo "release version is already prepared: $VERSION" >&2
            exit 1
          fi
          git commit -m "$title"
          git push --force-with-lease origin "$branch"
          pr_number=$(gh pr list --state open --base main --head "$branch" \
            --json number --jq '.[0].number // empty')
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$branch" \
              --title "$title" --body "$body"
          fi
          gh workflow run ci.yml --ref "$branch"
