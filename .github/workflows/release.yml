name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prepared CalVer release version (YYYY.M.PATCH)
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub and OCI release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify prepared release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "release already exists: $tag" >&2
            exit 1
          fi
          manifest_version=$(nix eval --raw .#packages.x86_64-linux.telchar.version)
          if [[ "$RELEASE_VERSION" != "$manifest_version" ]]; then
            echo "requested release $RELEASE_VERSION does not match package version $manifest_version" >&2
            exit 1
          fi

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes \
            --draft \
            --notes "OCI images:\n- ghcr.io/techcyte/telchar:$RELEASE_VERSION\n- ghcr.io/techcyte/telchar-nomad-worker:$RELEASE_VERSION\n- ghcr.io/techcyte/telchar-nix-daemon:$RELEASE_VERSION\n- ghcr.io/techcyte/telchar-ssh-ingress:$RELEASE_VERSION"

      - name: Publish release images
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: scripts/publish-oci-images.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release edit "v$RELEASE_VERSION" --draft=false
