name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prepared CalVer release version (YYYY.M.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub and OCI release
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            keep-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        # v7
        uses: >-
          nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: >-
            nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{
            hashFiles('flake.lock') }}-${{ github.run_id }}-${{
            github.run_attempt }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          gc-max-store-size: 5G

      - name: Allow test namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Verify prepared release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "release already exists: $tag" >&2
            exit 1
          fi
          manifest_version=$(nix eval --raw .#packages.x86_64-linux.telchar.version)
          if [[ "$RELEASE_VERSION" != "$manifest_version" ]]; then
            echo "requested release $RELEASE_VERSION does not match package version $manifest_version" >&2
            exit 1
          fi

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          notes=$(printf '%s\n' 'OCI images:'; \
            printf -- '- ghcr.io/techcyte/%s:%s\n' \
              telchar "$RELEASE_VERSION" \
              telchar-nomad-worker "$RELEASE_VERSION" \
              telchar-nix-daemon "$RELEASE_VERSION" \
              telchar-ssh-ingress "$RELEASE_VERSION")
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes \
            --draft \
            --notes "$notes"

      - name: Publish release images
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ inputs.version }}
        run: scripts/publish-oci-images.sh

  arm-worker:
    name: Publish ARM64 Nomad worker image
    permissions:
      contents: read
      packages: write
    needs: publish
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            keep-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        # v7
        uses: >-
          nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: >-
            nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{
            hashFiles('flake.lock') }}-${{ github.run_id }}-${{
            github.run_attempt }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          gc-max-store-size: 5G

      - name: Allow test namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build ARM64 Nomad worker image
        run: >-
          nix build -L --no-link
          .#packages.aarch64-linux.telchar-nomad-worker-oci

      - name: Scan ARM64 images
        env:
          IMAGE_SYSTEM: aarch64-linux
        run: scripts/check-oci-images.sh

      - name: Publish release images
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ inputs.version }}
          IMAGE_SYSTEM: aarch64-linux
        run: scripts/publish-oci-images.sh

  release:
    name: Publish GitHub release
    permissions:
      contents: write
    needs: [publish, arm-worker]
    runs-on: ubuntu-26.04
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release edit "v$RELEASE_VERSION" --draft=false
